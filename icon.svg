<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradCoin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- App Icon Base: Rounded Rectangle -->
    <rect width="512" height="512" rx="112" fill="url(#gradBrand)" />
    
    <!-- Coin Slot Base / Shadow -->
    <rect x="176" y="144" width="160" height="24" rx="12" fill="#047857" />
    <rect x="176" y="152" width="160" height="8" rx="4" fill="#064E3B" opacity="0.6" />
    
    <!-- Golden Coin (Dropping into slot) -->
    <circle cx="256" cy="224" r="64" fill="url(#gradCoin)" />
    <!-- Dollar symbol on coin -->
    <path d="M256 184 v80 M240 200 c0-16 32-16 32 0 c0 16-32 16-32 32 c0 16 32 16 32 0" 
          stroke="#D97706" stroke-width="12" fill="none" stroke-linecap="round" />
    
    <!-- White Container / Jar -->
    <path d="M144 288 h224 v96 a48 48 0 0 1 -48 48 h-128 a48 48 0 0 1 -48 -48 z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Jar Lid/Rim -->
    <rect x="128" y="264" width="256" height="32" rx="8" fill="#F3F4F6" />
    <rect x="128" y="288" width="256" height="8" fill="#D1D5DB" />
    
    <!-- Graphical element on the jar (check mark for success/saving) -->
    <rect x="200" y="328" width="112" height="48" rx="8" fill="#10B981" opacity="0.15" />
    <path d="M232 352 l16 16 l32 -32" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>